name: Fabricar App iPad

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: '1. Enlace Buzzheavier del JUEGO (acabado en /download)'
        required: true
      keys_url:
        description: '2. Enlace Buzzheavier de PROD.KEYS (acabado en /download)'
        required: true
      firmware_url:
        description: '3. Enlace Buzzheavier del FIRMWARE (acabado en /download)'
        required: true
      game_profile:
        description: '4. Nombre del perfil del juego (ej. botw, totk, arceus)'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Bajar proyecto
        uses: actions/checkout@v4

      - name: Preparar Mac virtual
        run: |
          brew install cmake ninja llvm

      - name: Descargar tus 3 archivos
        run: |
          mkdir -p input
          curl -L "${{ github.event.inputs.game_url }}" -o input/game.nsp
          curl -L "${{ github.event.inputs.keys_url }}" -o input/prod.keys
          curl -L "${{ github.event.inputs.firmware_url }}" -o input/firmware.zip

      - name: Fabricar IPA
        run: |
          chmod +x build.sh || true
          ./build.sh --game input/game.nsp --keys input/prod.keys --firmware input/firmware.zip --profile "${{ github.event.inputs.game_profile }}"

      - name: Guardar IPA terminado
        uses: actions/upload-artifact@v4
        with:
          name: juego-listo-ipad
          path: "**/*.ipa"
